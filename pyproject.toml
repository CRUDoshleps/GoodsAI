[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goodsai"
version = "0.1.0"
description = "Evidence-based, text-only product attribute extraction baseline"
requires-python = ">=3.12"
dependencies = ["pyarrow==26.0.0"]

[project.optional-dependencies]
serve = ["fastapi==0.143.3", "uvicorn==0.54.0"]
test = ["httpx==0.28.1"]
ml = ["torch==2.9.1", "gliner==0.2.29", "transformers==4.57.6", "protobuf==6.33.5"]

fuzz = ["hypothesis==6.170.1"]

[project.scripts]
goodsai = "goodsai.cli:main"
goodsai-serve = "goodsai.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
goodsai = ["baseline.json", "examples/synthetic/*.json", "examples/synthetic/*.jsonl"]
