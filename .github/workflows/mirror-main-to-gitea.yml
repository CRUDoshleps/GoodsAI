name: Publish submission to Gitea

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mirror-main-to-gitea
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITEA_USERNAME: ${{ secrets.GITEA_USERNAME }}
      GITEA_PASSWORD: ${{ secrets.GITEA_PASSWORD }}
      GITEA_REPOSITORY: https://git.hub.gigaschool.ru/tochka-sborki-2026-team-054/project.git
    steps:
      - name: Check out the complete GitHub history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish clean submission (fast-forward only)
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GITEA_USERNAME}" || -z "${GITEA_PASSWORD}" ]]; then
            echo "::error::GITEA_USERNAME and GITEA_PASSWORD secrets are required"
            exit 1
          fi

          askpass="${RUNNER_TEMP}/gitea-askpass.sh"
          cat >"${askpass}" <<'EOF'
          #!/usr/bin/env sh
          case "$1" in
            *sername*) printf '%s\n' "$GITEA_USERNAME" ;;
            *assword*) printf '%s\n' "$GITEA_PASSWORD" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "${askpass}"
          trap 'rm -f "${askpass}"' EXIT

          export GIT_ASKPASS="${askpass}"
          export GIT_TERMINAL_PROMPT=0

          git remote add gitea "${GITEA_REPOSITORY}"
          python scripts/release/publish_gitea.py \
            --source "${GITHUB_SHA}" \
            --remote gitea \
            --output "${RUNNER_TEMP}/gitea-publication.json"

      - name: Retain publication provenance
        uses: actions/upload-artifact@v4
        with:
          name: gitea-publication
          path: ${{ runner.temp }}/gitea-publication.json
          if-no-files-found: error
