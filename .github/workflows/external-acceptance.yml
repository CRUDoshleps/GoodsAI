name: External input acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[serve,test]'
      - name: Text-only preparation, source profiles and frozen split handoff
        run: python -m unittest discover -s tests -p "test_data*.py" -v
      - name: Offline human quality evidence, blocked gold and reproducible metrics
        run: python -m unittest discover -s tests -p test_quality_evidence.py -v
      - name: SQLite audit lifecycle and transaction regressions
        run: python -m unittest discover -s tests -p test_review_priority.py -v
      - name: Limited storage acceptance policy, rollback and CLI/API agreement
        run: python -m unittest discover -s tests -p test_storage_acceptance.py -v
      - name: Per-attribute shadow policies, frozen audit and human answer guards
        run: python -m unittest discover -s tests -p test_attribute_shadow.py -v
      - name: Candidate confidence, sparse calibration and CLI/API agreement
        run: python -m unittest discover -s tests -p test_confidence.py -v
      - name: Learned advisory artifact safety, scope fallback and CLI/API agreement
        run: python -m unittest discover -s tests -p test_learned_confidence.py -v
      - name: Strict external CLI and listening HTTP without packaged examples
        run: python scripts/release/external_acceptance.py --seed 20261020 --output-dir outputs/external-ci
      - name: Executable scenario matrix with explicit uncovered requirements
        run: python scripts/release/scenario_matrix.py --seed 20261020 --output-dir outputs/scenarios-ci
      - name: Retain synthetic scenario evidence and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-matrix-${{ matrix.os }}
          path: outputs/scenarios-ci/
      # No continue-on-error: known regressions intentionally fail this job too.
      - name: Retain synthetic acceptance evidence, including failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-acceptance-${{ matrix.os }}
          path: |
            outputs/external-ci/report.json
            outputs/external-ci/report.md
            outputs/external-ci/input.jsonl
            outputs/external-ci/expected.json
            outputs/external-ci/predictions.jsonl
            outputs/external-ci/predictions.manifest.json
            outputs/external-ci/http_predictions.json
            outputs/external-ci/malformed.jsonl
